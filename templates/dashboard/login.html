<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — AI Proposal Assistant</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #2c3e50;
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-box {
        background: white;
        padding: 40px 35px;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        width: 340px;
    }
    .login-box h1 {
        font-size: 18px;
        color: #2c3e50;
        text-align: center;
        margin-bottom: 25px;
    }
    .login-box input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }
    .login-box button {
        width: 100%;
        padding: 11px;
        background: #2c3e50;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
    .login-box button:hover { background: #34495e; }
    .error-msg {
        color: #e74c3c;
        font-size: 13px;
        margin-bottom: 14px;
        text-align: center;
    }
</style>
</head>
<body>
    <div class="login-box">
        <h1>🧠 AI Proposal Assistant</h1>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
